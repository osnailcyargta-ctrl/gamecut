<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Player</title>
<link rel="stylesheet" href="css/main.css">
<style>
  body{ overflow:auto; }
  .phead{ height:58px; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  .phead a{ margin-left:auto; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; padding:20px; max-width:1100px; margin:0 auto; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px;
    cursor:pointer; transition:border-color .12s, transform .12s; text-align:left; color:var(--text);
  }
  .card:hover{ border-color:var(--acc); transform:translateY(-2px); }
  .card .ic{ font-size:30px; }
  .card b{ display:block; margin:8px 0 4px; font-size:15px; }
  .card small{ line-height:1.5; display:block; }
  #pvStage{ position:fixed; inset:0; background:rgba(10,10,14,.97); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
  #pvCanvas{ max-width:96vw; max-height:82vh; border-radius:10px; background:#000; box-shadow:0 10px 50px rgba(0,0,0,.6); }
  .psub{ color:var(--dim); font-size:12.5px; padding:0 20px 16px; max-width:1100px; margin:0 auto; }
</style>
</head>
<body>
<div class="phead">
  <div class="logo">◆ NEXUS <small>player</small></div>
  <a class="btn" href="index.html">← Buka Editor</a>
</div>
<div class="psub">Game di bawah ini dibuat <b>100% dengan node engine</b> — bukan kode hardcoded. Buka di editor untuk melihat graph-nya.</div>
<div id="pvList" class="grid"></div>

<div id="pvStage">
  <div class="playbar">
    <b id="pvTitle"></b>
    <div class="row gap">
      <button id="pvRe" class="btn sm">🔄 Ulang</button>
      <button id="pvStop" class="btn sm danger">⏹ Tutup <small>Esc</small></button>
    </div>
  </div>
  <canvas id="pvCanvas"></canvas>
  <div class="playhint">Klik area game dulu jika tombol keyboard tidak merespons.</div>
</div>

<script src="js/core/util.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/nodedefs.js"></script>
<script src="js/core/interpreter.js"></script>
<script src="js/core/runtime.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/player.js"></script>
</body>
</html>
